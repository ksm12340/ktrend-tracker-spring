<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>키워드 비교 | K-Trend Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>

                <!-- 관심 키워드 -->
                <a sec:authorize="isAuthenticated()" href="/favorites">관심 키워드</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">관심 키워드</a>

                <!-- 검색 기록 -->
                <a sec:authorize="isAuthenticated()" href="/history">검색 기록</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">검색 기록</a>

                <!-- 마이페이지 -->
                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="compare-title">키워드 비교</h2>
    <p class="compare-subtitle">여러 키워드의 상대적인 검색 관심도 변화를 비교해 보세요.</p>

    <!-- Compare Input Form -->
    <form action="/keyword/compare" method="get" id="compareForm" class="compare-form">
        <div class="compare-form-inner">
            <label class="compare-form-label">비교할 키워드</label>
            <div class="compare-input-wrapper">
                <input type="text" name="keywords" id="keywordsInput" th:value="${keywords}"  class="compare-input" required>
                <input type="hidden" name="period" th:value="${period}">
                <button type="submit" class="btn-hover-bounce compare-btn">비교하기</button>
            </div>
            <!-- 가이드 -->
            <span class="compare-guideline">⚠️ 쉼표(,)로 구분해서 입력하세요. 비교는 최대 5개까지만 가능합니다.</span>
        </div>
    </form>

    <!-- Chips / Badges Container -->
    <div class="compare-chips-container" id="compareChips">
        <!-- Rendered by JS -->
    </div>

    <!-- Error/Warning Messages -->
    <p class="error compare-error" th:if="${message}" th:text="${message}"></p>

    <div th:if="${keywords != null and !keywords.isEmpty()}">
        <!-- Period form -->
        <form action="/keyword/compare" method="get" class="period-form">
            <input type="hidden" name="keywords" th:value="${keywords}">

            <button type="submit" name="period" value="7d"
                    th:classappend="${period == '7d'} ? 'active'">7일</button>

            <button type="submit" name="period" value="30d"
                    th:classappend="${period == '30d'} ? 'active'">30일</button>

            <button type="submit" name="period" value="90d"
                    th:classappend="${period == '90d'} ? 'active'">90일</button>

            <button type="submit" name="period" value="1y"
                    th:classappend="${period == '1y'} ? 'active'">1년</button>

            <div class="custom-period">
                <input type="date" name="startDate" th:value="${startDate}">
                <span>~</span>
                <input type="date" name="endDate" th:value="${endDate}">
                <button type="submit" name="period" value="custom"
                        th:classappend="${period == 'custom'} ? 'active'">직접선택</button>
            </div>
        </form>

        <h3 class="compare-result-title">📈 관심도 비교 결과</h3>
        <canvas id="compareChart" width="900" height="380"></canvas>
    </div>
</div>


<script th:inline="javascript">
    /*<![CDATA[*/
    const compareData = [[${compareData}]];
    /*]]>*/

    const colors = [
        '#03c75a',
        '#2563eb',
        '#f97316',
        '#a855f7',
        '#ef4444'
    ];

    // --- 1. Chips Rendering & Interaction ---
    const keywordInput = document.getElementById('keywordsInput');
    const chipsContainer = document.getElementById('compareChips');

    function renderChips() {
        if (!keywordInput || !chipsContainer) return;
        const value = keywordInput.value.trim();
        if (!value) {
            chipsContainer.innerHTML = '';
            return;
        }

        const keywords = value.split(',').map(k => k.trim()).filter(k => k.length > 0);
        let html = '';
        keywords.forEach((kw, idx) => {
            html += `
                <span class="compare-chip">
                    <span>${escapeHtml(kw)}</span>
                    <button type="button" class="compare-chip-delete" onclick="deleteKeywordChip(${idx})">✕</button>
                </span>
            `;
        });

        if (keywords.length > 0) {
            html += `<button type="button" class="clear-all-btn" onclick="clearAllKeywords()">전체 지우기</button>`;
        }

        chipsContainer.innerHTML = html;
    }

    function deleteKeywordChip(index) {
        const value = keywordInput.value.trim();
        const keywords = value.split(',').map(k => k.trim()).filter(k => k.length > 0);
        keywords.splice(index, 1);
        keywordInput.value = keywords.join(',');

        const form = document.getElementById('compareForm');
        if (form) form.submit();
    }

    function clearAllKeywords() {
        keywordInput.value = '';
        const form = document.getElementById('compareForm');
        if (form) form.submit();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderChips();
    });

    // --- 2. Chart Rendering ---
    if (compareData && Object.keys(compareData).length > 0) {
        const keywordNames = Object.keys(compareData);
        let labels = [];

        if (keywordNames.length > 0) {
            labels = compareData[keywordNames[0]].map(item => item.trendDate);
        }

        const datasets = keywordNames.map((keyword, index) => {
            const hexColor = colors[index % colors.length];
            // Convert hex to rgba for low opacity area fill (~0.04)
            let rgb = 'rgba(0, 0, 0, 0.04)';
            if (hexColor.startsWith('#')) {
                const r = parseInt(hexColor.slice(1, 3), 16);
                const g = parseInt(hexColor.slice(3, 5), 16);
                const b = parseInt(hexColor.slice(5, 7), 16);
                rgb = `rgba(${r}, ${g}, ${b}, 0.04)`;
            }

            return {
                label: keyword,
                data: compareData[keyword].map(item => item.interestValue),
                borderColor: hexColor,
                backgroundColor: rgb,
                fill: true,
                borderWidth: 2.5,
                pointRadius: 3.5,
                pointHoverRadius: 5.5,
                pointBackgroundColor: hexColor,
                pointBorderColor: '#ffffff',
                pointBorderWidth: 1.5,
                tension: 0.35
            };
        });

        const ctx = document.getElementById('compareChart');
        if (ctx) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1000,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                pointStyle: 'circle',
                                padding: 22,
                                font: {
                                    family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif",
                                    size: 13,
                                    weight: 'bold'
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.9)',
                            padding: 12,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 12 }
                            }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            grid: {
                                color: '#f1f5f9'
                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 12 }
                            }
                        }
                    }
                }
            });
        }
    }
</script>
</body>
</html>
