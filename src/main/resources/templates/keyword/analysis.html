<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>키워드 분석 | K-Trend Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>

                <!-- 관심 키워드 -->
                <a sec:authorize="isAuthenticated()" href="/favorites">관심 키워드</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">관심 키워드</a>

                <!-- 검색 기록 -->
                <a sec:authorize="isAuthenticated()" href="/history">검색 기록</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">검색 기록</a>

                <!-- 마이페이지 -->
                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="search-bar-row">
        <!-- 검색창 -->
        <form action="/keyword/analysis" method="get" class="search-bar-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="키워드를 입력하세요" class="search-bar-input" required>
            <input type="hidden" name="period" th:value="${period}">
            <button type="submit" class="btn-hover-bounce search-bar-btn">검색</button>
        </form>

        <!-- 관심키워드추가 버튼 -->
        <form th:if="${keyword != null and !keyword.isEmpty()}" action="/favorites" method="post" class="analysis-fav-form">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <button type="submit" class="btn-outline btn-hover-bounce analysis-fav-btn">
                <span>➕ 관심 키워드 추가</span>
            </button>
        </form>
    </div>

    <div th:if="${keyword == null or keyword.isEmpty()}" class="no-data-placeholder">
        <p class="no-data-placeholder-title">분석하고 싶은 키워드를 입력해 주세요.</p>
        <p class="no-data-placeholder-desc">기간별 검색 트렌드와 관심도 지표를 실시간으로 확인해 드립니다.</p>
    </div>

    <div th:if="${keyword != null and !keyword.isEmpty()}">
        <h2 th:text="${keyword} + ' 검색 관심도 추이'" class="analysis-title">검색 관심도 추이</h2>

        <form action="/keyword/analysis" method="get" class="period-form">
            <input type="hidden" name="keyword" th:value="${keyword}">

            <button type="submit" name="period" value="7d"
                    th:classappend="${period == '7d'} ? 'active'">7일</button>
            <button type="submit" name="period" value="30d"
                    th:classappend="${period == '30d'} ? 'active'">30일</button>
            <button type="submit" name="period" value="90d"
                    th:classappend="${period == '90d'} ? 'active'">90일</button>
            <button type="submit" name="period" value="1y"
                    th:classappend="${period == '1y'} ? 'active'">1년</button>

            <div class="custom-period">
                <input type="date" name="startDate" th:value="${startDate}">
                <span>~</span>
                <input type="date" name="endDate" th:value="${endDate}">
                <button type="submit" name="period" value="custom"
                        th:classappend="${period == 'custom'} ? 'active'">직접선택</button>
            </div>
        </form>

        <!-- 관심도 트렌드변화 평균 -->
        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-title">🔥 최고 관심도</div>
                <div class="kpi-value" id="kpi-highest">-</div>
                <div class="kpi-subtext" id="kpi-highest-date">분석 기간 중 최고치</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">📈 최근 트렌드 변화</div>
                <div class="kpi-value" id="kpi-change">-</div>
                <div class="kpi-subtext" id="kpi-change-period">지난주 대비</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">📊 평균 관심도</div>
                <div class="kpi-value" id="kpi-average">-</div>
                <div class="kpi-subtext">분석 기간 전체 평균</div>
            </div>
        </div>

        <!-- Split Content Area -->
        <div class="analysis-layout">
            <div class="analysis-main">
                <canvas id="trendChart" width="800" height="380"></canvas>
            </div>
        </div>
    </div>
</div>
</div>


<script th:inline="javascript">
    /*<![CDATA[*/
    const trendData = [[${trendDataList}]];
    /*]]>*/

    if (trendData && trendData.length > 0) {
        const labels = trendData.map(item => item.trendDate);
        const values = trendData.map(item => item.interestValue);

        // --- 관심도 계산 ---
        // Highest Interest
        let maxVal = -1;
        let maxDate = "";
        for (let i = 0; i < values.length; i++) {
            if (values[i] > maxVal) {
                maxVal = values[i];
                maxDate = labels[i];
            }
        }
        document.getElementById('kpi-highest').innerText = `${maxVal}점`;
        document.getElementById('kpi-highest-date').innerText = `최고치 기록일: ${maxDate}`;

        // Average Interest
        const sum = values.reduce((acc, curr) => acc + curr, 0);
        const avg = (sum / values.length).toFixed(1);
        document.getElementById('kpi-average').innerText = `${avg}점`;

        // Trend Change (Compare last data point with data point from 7 days ago, or start if length < 8)
        if (values.length >= 2) {
            const lastVal = values[values.length - 1];
            const prevIndex = Math.max(0, values.length - 8);
            const prevVal = values[prevIndex];
            const diff = lastVal - prevVal;
            const sign = diff >= 0 ? "+" : "";
            document.getElementById('kpi-change').innerText = `${sign}${diff}점`;
            document.getElementById('kpi-change').style.color = diff >= 0 ? '#e5484d' : '#2563eb';
            document.getElementById('kpi-change-period').innerText = `${labels[prevIndex]} 대비 ${diff >= 0 ? '상승 📈' : '하락 📉'}`;
        } else {
            document.getElementById('kpi-change').innerText = "데이터 부족";
        }





        // --- 관심도 차트 ---
        const ctx = document.getElementById('trendChart');
        if (ctx) {
            // Create a gradient for the area chart
            const chartContext = ctx.getContext('2d');
            const gradient = chartContext.createLinearGradient(0, 0, 0, 350);
            gradient.addColorStop(0, 'rgba(3, 199, 90, 0.35)');
            gradient.addColorStop(1, 'rgba(3, 199, 90, 0.00)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '검색 관심도',
                        data: values,
                        borderColor: '#03c75a',
                        backgroundColor: gradient,
                        fill: true,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#03c75a',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        tension: 0.35
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1200,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.9)',
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 13 },
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: false
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 12 }
                            }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            grid: {
                                color: '#f1f5f9'
                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 12 },
                                stepSize: 20
                            }
                        }
                    }
                }
            });
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
