<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-box">
        <a href="/" class="auth-logo">K-Trend Tracker</a>

        <h1>로그인</h1>
        <p class="auth-description">키워드 트렌드를 더 편하게 관리해보세요.</p>

        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form action="/login" method="post" class="auth-form">
            <div class="auth-input-group">
                <label>아이디</label>
                <input type="text" name="loginId" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="auth-input-group">
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="auth-button">로그인</button>
        </form>

        <div class="auth-footer">
            <span>계정이 없으신가요?</span>
            <a href="/join">회원가입</a>
        </div>
    </div>
</div>

</body>
</html>
