<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-box">
        <a href="/" class="auth-logo">K-Trend Tracker</a>

        <h1>회원가입</h1>
        <p class="auth-description">회원가입 후 관심 키워드와 검색 기록을 관리해보세요.</p>

        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form action="/join" method="post" class="auth-form">
            <div class="auth-input-group">
                <label>아이디</label>
                <input type="text" name="loginId" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="auth-input-group">
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <div class="auth-input-group">
                <label>비밀번호 확인</label>
                <input type="password" name="passwordCheck" placeholder="비밀번호를 다시 입력하세요" required>
            </div>

            <div class="auth-input-group">
                <label>이름</label>
                <input type="text" name="name" placeholder="이름을 입력하세요" required>
            </div>

            <div class="auth-input-group">
                <label>이메일</label>
                <input type="email" name="email" placeholder="이메일을 입력하세요" required>
            </div>

            <button type="submit" class="auth-button">회원가입</button>
        </form>

        <div class="auth-footer">
            <span>이미 계정이 있으신가요?</span>
            <a href="/login">로그인</a>
        </div>
    </div>
</div>

</body>
</html>
