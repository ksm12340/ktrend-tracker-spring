<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>검색 기록 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>
                <a href="/favorites">관심 키워드</a>
                <a href="/history">검색 기록</a>
                <a href="/mypage">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<hr>

<table border="1">
    <thead>
    <tr>
        <th>키워드</th>
        <th>검색일시</th>
        <th>다시검색</th>
        <th>삭제</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="history : ${histories}">
        <td th:text="${history.keyword.keywordName}">아이폰</td>
        <td th:text="${#temporals.format(history.searchedAt, 'yyyy-MM-dd HH:mm')}">2026-06-18 21:00</td>
        <td>
            <a th:href="@{/keyword/analysis(keyword=${history.keyword.keywordName})}">보기</a>
        </td>
        <td>
            <form action="/history/delete" method="post">
                <input type="hidden" name="historyId" th:value="${history.historyId}">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
