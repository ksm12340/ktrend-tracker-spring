```html
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>관심 키워드 | K-Trend Tracker</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<nav class="top-nav">
    <div class="nav-inner">

        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>

                <a sec:authorize="isAuthenticated()" href="/favorites">관심 키워드</a>
                <a sec:authorize="isAnonymous()"
                   href="javascript:void(0);"
                   onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">
                    관심 키워드
                </a>

                <a sec:authorize="isAuthenticated()" href="/history">검색 기록</a>
                <a sec:authorize="isAnonymous()"
                   href="javascript:void(0);"
                   onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">
                    검색 기록
                </a>

                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="isAnonymous()"
                   href="javascript:void(0);"
                   onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">
                    마이페이지
                </a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()"
                  action="/logout"
                  method="post"
                  class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>

    </div>
</nav>

<div class="container">

    <h2>관심 키워드</h2>

    <form action="/favorites" method="post" style="margin-bottom:20px;">
        <input type="text"
               name="keyword"
               placeholder="키워드 입력"
               required>

        <button type="submit">
            추가
        </button>
    </form>

    <table class="history-table">

        <thead>
        <tr>
            <th>키워드</th>
            <th>추가일시</th>
            <th>분석</th>
            <th>삭제</th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(favorites)}">
            <td colspan="4" style="text-align:center;">
                등록된 관심 키워드가 없습니다.
            </td>
        </tr>

        <tr th:each="favorite : ${favorites}">

            <td th:text="${favorite.keyword.keywordName}">
                아이폰
            </td>

            <td th:text="${#temporals.format(favorite.createdAt,'yyyy-MM-dd HH:mm')}">
                2026-06-18 20:30
            </td>

            <td style="text-align:center;">
                <a th:href="@{/keyword/analysis(keyword=${favorite.keyword.keywordName})}">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
            </td>

            <td style="text-align:center;">

                <form action="/favorites/delete"
                      method="post"
                      style="display:inline;">

                    <input type="hidden"
                           name="keyword"
                           th:value="${favorite.keyword.keywordName}">

                    <button type="submit">
                        삭제
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
```
