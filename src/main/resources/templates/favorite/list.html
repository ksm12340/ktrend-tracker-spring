<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>관심 키워드 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>

                <!-- 관심 키워드 -->
                <a sec:authorize="isAuthenticated()" href="/favorites">관심 키워드</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">관심 키워드</a>

                <!-- 검색 기록 -->
                <a sec:authorize="isAuthenticated()" href="/history">검색 기록</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">검색 기록</a>

                <!-- 마이페이지 -->
                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="favorites-title">
        ⭐ 관심 키워드
        <span class="favorites-count" th:text="'(총 ' + ${favorites.size()} + '개 등록됨)'"> (총 0개 등록됨)</span>
    </h2>
    <p class="favorites-subtitle">자주 조회하는 관심 키워드를 등록하고 간편하게 바로 분석해 보세요.</p>

    <!-- Keyword Add Input -->
    <form action="/favorites" method="post" class="favorites-form">
        <div class="fav-input-wrapper">
            <input type="text" name="keyword" placeholder="추가할 키워드를 입력하세요 (예: 아이폰, 손흥민)" class="favorites-input" required>
            <button type="submit" class="btn-hover-bounce favorites-btn">키워드 추가</button>
        </div>
    </form>

    <!-- Favorites Table -->
    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th class="text-left col-width-50">키워드</th>
                <th class="col-width-30">추가일</th>
                <th class="col-width-20">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${favorites == null or favorites.isEmpty()}">
                <td colspan="3" class="favorites-no-data">
                    등록된 관심 키워드가 없습니다. 상단에서 키워드를 추가해 보세요!
                </td>
            </tr>
            <tr th:each="favorite : ${favorites}">
                <td class="text-left col-keyword-strong" th:text="${favorite.keyword.keywordName}">아이폰</td>
                <td class="col-date-text" th:text="${#temporals.format(favorite.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-18</td>
                <td class="favorites-actions-td">
                    <a th:href="@{/keyword/analysis(keyword=${favorite.keyword.keywordName})}" class="btn-mini-analyze">분석</a>

                    <form action="/favorites/delete" method="post" class="inline-form">
                        <input type="hidden" name="keyword" th:value="${favorite.keyword.keywordName}">
                        <button type="submit" class="btn-mini-delete">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>


</body>
</html>
