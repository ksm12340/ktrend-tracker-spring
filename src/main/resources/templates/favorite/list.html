<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>관심 키워드 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>

                <!-- 관심 키워드 -->
                <a sec:authorize="isAuthenticated()" href="/favorites">관심 키워드</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">관심 키워드</a>

                <!-- 검색 기록 -->
                <a sec:authorize="isAuthenticated()" href="/history">검색 기록</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">검색 기록</a>

                <!-- 마이페이지 -->
                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<hr>

<form action="/favorites" method="post">
    <input type="text" name="keyword" placeholder="키워드 입력" required>
    <button type="submit">키워드 추가</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>키워드</th>
        <th>추가일</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="favorite : ${favorites}">
        <td th:text="${favorite.keyword.keywordName}">아이폰</td>
        <td th:text="${#temporals.format(favorite.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-18</td>
        <td>
            <a th:href="@{/keyword/analysis(keyword=${favorite.keyword.keywordName})}">분석하기</a>

            <form action="/favorites/delete" method="post" style="display:inline;">
                <input type="hidden" name="keyword" th:value="${favorite.keyword.keywordName}">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
