<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>
                <a href="/favorites">관심 키워드</a>
                <a href="/history">검색 기록</a>
                <a href="/mypage">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>


<div class="container">


<hr>

<form action="/keyword/analysis" method="get">
    <input type="text" name="keyword" placeholder="키워드를 입력하세요">
    <button type="submit">검색</button>
</form>

    <h2>인기 키워드</h2>
    <ul class="keyword-list">
        <li th:each="popularKeyword : ${popularKeywords}">
            <a th:href="@{/keyword/analysis(keyword=${popularKeyword})}"
               th:text="${popularKeyword}">아이폰</a>
        </li>
    </ul>

    <div class="keyword-"></div>


    </div>
