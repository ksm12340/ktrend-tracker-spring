<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h1>K-Trend Tracker</h1>
<p>네이버 데이터랩 기반 키워드 관심도 분석 플랫폼</p>

<nav>
    <a href="/">홈</a>
    <a href="/keyword/analysis">키워드 분석</a>
    <a href="/keyword/compare">키워드 비교</a>
    <a href="/favorites">관심 키워드</a>
    <a href="/history">검색 기록</a>
    <a href="/mypage">마이페이지</a>
</nav>


<div class="container">


<hr>

<form action="/keyword/analysis" method="get">
    <input type="text" name="keyword" placeholder="키워드를 입력하세요">
    <button type="submit">검색</button>
</form>

    <h2>인기 키워드</h2>
    <ul class="keyword-list">
        <li th:each="popularKeyword : ${popularKeywords}">
            <a th:href="@{/keyword/analysis(keyword=${popularKeyword})}"
               th:text="${popularKeyword}">아이폰</a>
        </li>
    </ul>

<div>
    <span sec:authorize="isAuthenticated()">
        로그인 상태입니다.
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit">로그아웃</button>
        </form>
    </span>

    <span sec:authorize="isAnonymous()">
        <a href="/login">로그인</a>
        <a href="/join">회원가입</a>
    </span>
</div>

</div>
</body>
</html>
