<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h1>마이페이지</h1>

<nav>
    <a href="/">홈</a>
    <a href="/keyword/analysis">키워드 분석</a>
    <a href="/keyword/compare">키워드 비교</a>
    <a href="/favorites">관심 키워드</a>
    <a href="/history">검색 기록</a>
    <a href="/mypage">마이페이지</a>
</nav>

<hr>

<h2 th:text="${user.name} + '님'">사용자님</h2>

<table border="1">
    <tr>
        <th>아이디</th>
        <td th:text="${user.loginId}">abcd1234</td>
    </tr>
    <tr>
        <th>이름</th>
        <td th:text="${user.name}">김철수</td>
    </tr>
    <tr>
        <th>이메일</th>
        <td th:text="${user.email}">aaa@naver.com</td>
    </tr>
    <tr>
        <th>가입일</th>
        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2026-06-18</td>
    </tr>
</table>

<br>

<form action="/logout" method="post">
    <button type="submit">로그아웃</button>
</form>

</body>
</html>
