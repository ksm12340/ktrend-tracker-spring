<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | K-Trend Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a href="/" class="logo">K-Trend Tracker</a>

            <div class="nav-menu">
                <a href="/">홈</a>
                <a href="/keyword/analysis">키워드 분석</a>
                <a href="/keyword/compare">키워드 비교</a>

                <!-- 관심 키워드 -->
                <a sec:authorize="isAuthenticated()" href="/favorites">관심 키워드</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">관심 키워드</a>

                <!-- 검색 기록 -->
                <a sec:authorize="isAuthenticated()" href="/history">검색 기록</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">검색 기록</a>

                <!-- 마이페이지 -->
                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="isAnonymous()" href="javascript:void(0);" onclick="alert('로그인 후 사용 가능합니다.'); location.href='/login';">마이페이지</a>
            </div>
        </div>

        <div class="nav-auth">
            <a sec:authorize="isAnonymous()" href="/login" class="auth-btn login-btn">로그인</a>
            <a sec:authorize="isAnonymous()" href="/join" class="auth-btn join-btn">회원가입</a>

            <form sec:authorize="isAuthenticated()" action="/logout" method="post" class="logout-form">
                <button type="submit" class="auth-btn logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Profile Section -->
    <div class="profile-section">
        <div class="profile-avatar" th:text="${#strings.substring(user.name, 0, 1)}">U</div>
        <div class="profile-info">
            <h2 class="profile-greeting" th:text="'안녕하세요, ' + ${user.name} + '님!'">안녕하세요, 사용자님!</h2>
            <p class="profile-email" th:text="${user.email}">user@email.com</p>
        </div>
    </div>

    <!-- User Information Card -->
    <div class="mypage-card">
        <h3 class="mypage-card-title">
            👤 계정 정보
        </h3>
        <table class="mypage-table">
            <tr>
                <th>아이디</th>
                <td th:text="${user.loginId}">abcd1234</td>
            </tr>
            <tr>
                <th>이름</th>
                <td th:text="${user.name}">김철수</td>
            </tr>
            <tr>
                <th>이메일</th>
                <td th:text="${user.email}">aaa@naver.com</td>
            </tr>
            <tr>
                <th>가입일</th>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2026-06-18</td>
            </tr>
        </table>
    </div>

    <!-- Activity Summary (Mini KPI Cards) -->
    <h3 class="mypage-section-title">
        📊 나의 활동 요약
    </h3>
    <div class="mypage-kpi-container">
        <!-- Registered Favorite Keywords -->
        <a href="/favorites" class="mypage-kpi-card">
            <div class="mypage-kpi-info">
                <h4>⭐ 관심 키워드</h4>
                <p th:text="${favoriteCount} + '개'">0개</p>
            </div>
            <div class="mypage-kpi-arrow">바로가기 →</div>
        </a>

        <!-- Search History -->
        <a href="/history" class="mypage-kpi-card">
            <div class="mypage-kpi-info">
                <h4>🕒 최근 검색 기록</h4>
                <p th:text="${historyCount} + '건'">0건</p>
            </div>
            <div class="mypage-kpi-arrow">바로가기 →</div>
        </a>
    </div>
</div>


</body>
</html>
